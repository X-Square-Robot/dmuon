<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">Interleaved storage and independent logical matrices</title>
  <desc id="desc">The physical rows Q0 K0 V0 Q1 K1 V1 stay unchanged. MatrixLayout groups Q0 with Q1, K0 with K1, and V0 with V1 for three independent matrix updates.</desc>
  <rect width="960" height="350" rx="14" fill="#f4f7fb"/>
  <g font-family="system-ui,sans-serif" font-size="16" fill="#193650">
    <text x="32" y="39" font-size="14" letter-spacing="1.4">PHYSICAL STORAGE</text>
    <text x="32" y="65">One original parameter · head-major QKV</text>
    <text x="586" y="39" font-size="14" letter-spacing="1.4">LOGICAL NS MATRICES</text>
    <text x="586" y="65">Three independent updates</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="17" text-anchor="middle" fill="white">
    <rect x="32" y="98" width="64" height="54" rx="7" fill="#1f6473"/><text x="64" y="131">Q₀</text>
    <rect x="101" y="98" width="64" height="54" rx="7" fill="#426993"/><text x="133" y="131">K₀</text>
    <rect x="170" y="98" width="64" height="54" rx="7" fill="#827054"/><text x="202" y="131">V₀</text>
    <rect x="239" y="98" width="64" height="54" rx="7" fill="#1f6473"/><text x="271" y="131">Q₁</text>
    <rect x="308" y="98" width="64" height="54" rx="7" fill="#426993"/><text x="340" y="131">K₁</text>
    <rect x="377" y="98" width="64" height="54" rx="7" fill="#827054"/><text x="409" y="131">V₁</text>
    <rect x="586" y="98" width="140" height="46" rx="7" fill="#1f6473"/><text x="656" y="127">Q₀ + Q₁</text>
    <rect x="586" y="155" width="140" height="46" rx="7" fill="#426993"/><text x="656" y="184">K₀ + K₁</text>
    <rect x="586" y="212" width="140" height="46" rx="7" fill="#827054"/><text x="656" y="241">V₀ + V₁</text>
  </g>
  <path d="M470 125H548m-9-7 9 7-9 7" stroke="#6e8499" stroke-width="2" fill="none"/>
  <g font-family="system-ui,sans-serif" font-size="15" fill="#50677d">
    <text x="32" y="186">Model shape: [24, 8]</text>
    <text x="32" y="212">2 heads × 3 components × 4 rows × 8 columns</text>
    <text x="754" y="127">[8, 8]</text><text x="754" y="184">[8, 8]</text><text x="754" y="241">[8, 8]</text>
  </g>
  <path d="M32 282H928" stroke="#d6e1eb"/>
  <text x="32" y="316" font-family="ui-monospace,monospace" font-size="15" fill="#193650">view(2, 3, 4, 8).permute(1, 0, 2, 3).reshape(3, 8, 8)</text>
</svg>
